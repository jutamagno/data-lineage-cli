[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lineage"]

[project]
name = "data-lineage-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "sqlglot>=25.0",
    "rich>=13.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
watch = ["watchdog>=4.0"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
src = ["lineage", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lineage"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "sqlglot.*"]
ignore_missing_imports = true
